<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Auvix Studio — scene</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="stage">
  <div id="bg">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="scan"></div>
  </div>
  <div id="grid"></div>
  <div id="layers"></div>
  <div id="vign"></div>
  <div id="grain"></div>
  <div id="flash"></div>
</div>

<!-- Фильтр «жидкого металла»: тёплое искажение конического градиента.
     Живёт в документе, потому что CSS filter:url() умеет ссылаться только
     на фильтр из того же документа. -->
<svg width="0" height="0" style="position:absolute">
  <filter id="warp" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016"
                  numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="15"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<script src="content.js"></script>
<script src="engine.js"></script>
<script>
/* Зерно генерируем один раз детерминированным PRNG — так текстура
   одинакова между запусками, и рендер остаётся воспроизводимым. */
(function () {
  const N = 400;
  const c = document.createElement('canvas');
  c.width = c.height = N;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(N, N);
  let s = 1337;
  const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < N * N; i++) {
    // contrast(180%) brightness(115%) вокруг средней точки 128, но заранее
    let v = (90 + rnd() * 165 - 128) * 1.8 * 1.15 + 128;
    v = v < 0 ? 0 : v > 255 ? 255 : v;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v;
    img.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  document.getElementById('grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();
</script>
<script src="blocks.js"></script>
<script>
/* Рендерер вызывает window.seek(t) и ждёт, пока шрифты и раскладка осядут. */
window.__ready = document.fonts.ready.then(() => {
  window.renderFrame(0);
  return true;
});
window.seek = (t) => { window.renderFrame(t); };
</script>
</body>
</html>
